<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reis Bistrô - Em breve</title>
  <meta name="description" content="Reis Bistrô - site em construção. Cerveja, pizza e boas noites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --amber: #e0b87a;
      --copper: #c47a4a;
      --cream: #f3ebe0;
      --cream-muted: rgba(243, 235, 224, 0.72);
      --fallback-bg: #1a1410;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Outfit", "Segoe UI", sans-serif;
      color: var(--cream);
      background: var(--fallback-bg);
      overflow: hidden;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene__photo {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--fallback-bg);
    }

    .scene__photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      animation: kenburns 28s ease-in-out infinite alternate;
    }

    .scene__photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(14, 12, 10, 0.72) 0%,
        rgba(14, 12, 10, 0.55) 45%,
        rgba(14, 12, 10, 0.78) 100%
      );
    }

    .scene__glow {
      position: absolute;
      z-index: 1;
      width: min(70vw, 520px);
      height: min(70vw, 520px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 184, 122, 0.16) 0%, transparent 68%);
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite;
    }

    .brand {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1.5rem;
      max-width: 92vw;
    }

    .brand__name {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(3rem, 12vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--cream);
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .brand__name span {
      display: block;
      font-size: 0.42em;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--amber);
      margin-top: 0.55em;
      font-family: "Outfit", "Segoe UI", sans-serif;
      font-weight: 300;
    }

    .brand__rule {
      width: 3rem;
      height: 1px;
      margin: 1.35rem auto 0;
      background: linear-gradient(90deg, transparent, var(--copper), transparent);
      animation: fade 1.2s ease 0.85s both;
    }

    .brand__status {
      margin-top: 1.75rem;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream-muted);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
    }

    @keyframes kenburns {
      from { transform: scale(1.08) translate(0, 0); }
      to { transform: scale(1.16) translate(-1.5%, -1%); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene__photo img,
      .scene__glow,
      .brand__name,
      .brand__status,
      .brand__rule {
        animation: none;
      }

      .scene__photo img {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Reis Bistrô">
    <div class="scene__photo">
      <img
        src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=2400&q=80"
        alt="Pizza artesanal em ambiente noturno"
        onerror="this.style.display='none'"
      >
    </div>
    <div class="scene__glow" aria-hidden="true"></div>

    <div class="brand">
      <h1 class="brand__name">
        Reis
        <span>Bistrô</span>
      </h1>
      <div class="brand__rule" aria-hidden="true"></div>
      <p class="brand__status">Site em construção</p>
    </div>
  </main>
</body>
</html>
